[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "devgraph"
version = "0.1.0b1"
description = "Local work graph, ontology, and agent integrations"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
dependencies = [
  "cryptography>=50.0.1,<51",
  "fastapi>=0.136.3,<0.137",
  "httpx>=0.28.0,<0.29",
  "neo4j>=5.0",
  "pydantic>=2.0",
  "starlette>=1.3.1,<1.4",
  "uvicorn>=0.39.0,<0.40",
]

[project.scripts]
devgraph = "devgraph.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
devgraph = [
  "resources/*.in",
  "frontend/static/selection/core/*",
  "frontend/static/selection/page/*",
  "resources/migrations/*.cypher",
  "resources/migrations/*.json",
  "resources/ontology-releases/*/*",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
