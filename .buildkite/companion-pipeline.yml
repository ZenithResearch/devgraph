# Manual pipeline whose primary repository is castalia-wallet. Buildkite's
# existing GitHub connection supplies that checkout; no custom App key is used.
steps:
  - block: 'Approve the exact Devgraph source for private companion checks'
    key: companion-source-review
    prompt: >-
      Review DEVGRAPH_REVISION and this pipeline's exact Wallet commit before
      continuing. Only reviewed source may run beside private Wallet source.
      This is source acceptance, not installed signing or live activation.
  - label: ':link: Matched Devgraph, Wallet and secS'
    key: companion
    depends_on: companion-source-review
    agents: {queue: macos-15-medium}
    timeout_in_minutes: 90
    command: |
      set -euo pipefail
      [[ "$DEVGRAPH_REVISION" =~ ^[0-9a-f]{40}$ ]]
      export DEVGRAPH_WALLET_CHECKOUT="$PWD"
      git init build/devgraph
      git -C build/devgraph remote add origin https://github.com/ZenithResearch/devgraph.git
      git -C build/devgraph fetch --depth=1 origin "$DEVGRAPH_REVISION"
      git -C build/devgraph checkout --detach FETCH_HEAD
      test "$(git -C build/devgraph rev-parse HEAD)" = "$DEVGRAPH_REVISION"
      cd build/devgraph
      bash .buildkite/run.sh companion
    artifact_paths:
      - 'build/devgraph/.sdk-validation/companion-source.json'
      - 'build/devgraph/.sdk-validation/wallet-provider-contract.json'
      - 'build/devgraph/.sdk-validation/browser-core.json'
      - 'build/devgraph/.sdk-validation/installed-consumers.json'
      - 'build/devgraph/build/buildkite/companion/provenance.json'
      - 'build/devgraph/build/buildkite/companion/*audit*.json'
      - 'build/devgraph/packages/web/*.tgz'
