---
name: Devgraph verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Repository verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.6"
      - name: Sync locked environment
        run: uv sync --locked
      - name: Test suite
        run: uv run pytest -q
      - name: Install Node.js for frontend tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Frontend tests
        run: node --test tests/frontend/*.test.mjs tests/frontend_kanban.mjs
      - name: Repository verification
        run: bash docs/dev/verification.md
      - name: Lint
        run: uv run ruff check src tests scripts integrations
      - name: Whitespace
        run: git diff --check
      - name: Build Python and beta packages
        run: |
          uv build --out-dir "$RUNNER_TEMP/devgraph-python"
          uv run python scripts/build_beta.py --output-dir "$RUNNER_TEMP/devgraph-beta"

  rust-protocol:
    name: Shared Work and Arena protocol
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --target wasm32-unknown-unknown
      - name: Native protocol and immutable vectors
        run: cargo test --locked -p devgraph-work-protocol
      - name: Hostile serde feature conformance
        run: cargo test --locked -p devgraph-work-protocol --features hostile-map-order,hostile-number-repr
      - name: WebAssembly compilation
        run: cargo check --locked -p devgraph-work-protocol --target wasm32-unknown-unknown
      - name: Minimum supported Rust
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          cargo +1.85.1 test --locked -p devgraph-work-protocol --features hostile-map-order,hostile-number-repr
      - name: Formatting
        run: cargo fmt --all --check
