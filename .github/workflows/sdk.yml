---
name: Devgraph SDK verification

# Temporary public SDK parity checks during the Buildkite cutover.
# Companion checks now run in the Wallet-connected Buildkite pipeline.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-sdk:
    name: Public SDK and browser package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      RUSTUP_TOOLCHAIN: "1.96.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.18.0"
      - name: Install pinned Rust and WASM CLI
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
          cargo +1.96.0 install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Audit every Rust workspace lockfile
        run: |
          cargo install cargo-audit --version 0.22.1 --locked
          python3 scripts/audit-rust-locks.py
      - name: Public contracts and SDK
        run: |
          cargo test --locked --workspace --all-features
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo check --locked -p devgraph-web --target wasm32-unknown-unknown
      - name: SDK and browser fixtures
        working-directory: packages/web
        run: |
          npm ci --ignore-scripts
          npm run build
          npm test
          npx playwright install --with-deps chromium firefox webkit
          npm run test:browser
          npm run build
          npm pack --ignore-scripts
      - name: External installed package
        run: |
          consumer_dir=$(mktemp -d)
          cp packages/web/devgraph-web-0.2.0-preview.2.tgz "$consumer_dir/"
          npm install --prefix "$consumer_dir" --ignore-scripts "$consumer_dir/devgraph-web-0.2.0-preview.2.tgz" typescript@5.9.3 vite@7.3.5
          node packages/web/test/installed-consumer.mjs "$consumer_dir"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-devgraph-sdk
          path: |
            packages/web/*.tgz
            .sdk-validation/browser-core.json
            .sdk-validation/installed-consumers.json
