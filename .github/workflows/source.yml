name: Public source verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.10'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.18.0'
      - name: Install the repository's pinned uv
        run: python -m pip install uv==0.11.6
      - run: uv sync --locked
      - name: Repository verification (no private companions or deployment)
        run: bash docs/dev/verification.md
      - name: Frontend contracts and strict lint
        run: |
          node --test tests/frontend/*.test.mjs tests/frontend_kanban.mjs
          uv run ruff check src tests scripts integrations
          git diff --exit-code
