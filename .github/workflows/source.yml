name: Public source verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lane: [repository, protocol, sdk, codeql]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Verify public source
        env:
          DG_CI_LANE: ${{ matrix.lane }}
        run: bash scripts/ci/run.sh "$DG_CI_LANE"
      - name: Retain bounded verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: devgraph-${{ matrix.lane }}-${{ github.run_attempt }}
          path: |
            build/ci/${{ matrix.lane }}/*
            build/ci/packages/*
            packages/web/*.tgz
          if-no-files-found: warn
          retention-days: 7

  ci:
    name: DevGraph CI
    if: always()
    needs: [verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every public verification lane
        env:
          VERIFICATION_RESULT: ${{ needs.verify.result }}
        run: test "$VERIFICATION_RESULT" = success
