[package]
name = "devgraph-client-native"
version = "0.1.0-preview.1"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[dependencies]
castalia-wallet-presentation = { git = "https://github.com/bananawalnut/castalia-wallet.git", rev = "ff8de6ddc04ac2fb6b39408274276bc4ce984d42" }
devgraph-client-core = { path = "../devgraph-client-core" }
devgraph-work-protocol = { path = "../devgraph-work-protocol" }
castalia-wallet-devgraph-presentation = { git = "https://github.com/bananawalnut/castalia-wallet.git", rev = "3216144e8df04582e921810462845efc8c2cf390" }
secs-devgraph-work-contract = { git = "https://github.com/ZenithResearch/secS-magik.git", rev = "11e7128e49c6df57f53e4c8b05e72d4bc78d798c" }
secs-native-private-files = { git = "https://github.com/ZenithResearch/secS-magik.git", rev = "11e7128e49c6df57f53e4c8b05e72d4bc78d798c" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
bytes = "1"
reqwest = { version = "=0.12.28", default-features = false, features = ["stream"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
tempfile = "=3.27.0"
zeroize = "1"
rand = "0.8"
libc = "0.2"
ed25519-dalek = "2"

[dev-dependencies]
http = "1"
futures-util = "0.3"

[workspace]
resolver = "2"

# Companion contracts share the canonical producer in this public source revision.
# Preserve one Rust request type and exercise historical signing vectors together.
[patch."https://github.com/ZenithResearch/devgraph.git"]
devgraph-work-protocol = { path = "../devgraph-work-protocol" }
