[package]
name = "devgraph-client-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-only"
publish = false

[dependencies]
devgraph-work-protocol = { path = "../devgraph-work-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ts-rs = { version = "=12.0.1", optional = true }

[features]
hostile-map-order = ["serde_json/preserve_order"]
hostile-number-repr = ["serde_json/arbitrary_precision"]
declarations = ["dep:ts-rs"]

[[bin]]
name = "export-sdk-types"
path = "src/bin/export-sdk-types.rs"
required-features = ["declarations"]
